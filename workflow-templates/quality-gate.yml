# ==============================================================================
# Quality Gate — Tests + Coverage + Badge + PR Comment
# ==============================================================================
# ℹ️ INFO: This file is a STARTING POINT. Once you add it via GitHub's
# "New workflow" screen, it lives entirely in YOUR repo — nobody else's repo
# is affected, and you're free to edit/extend/break it however you like from
# here on. Think of it as scaffolding to accelerate your first pipeline, not
# a dependency you have to keep in sync with.
#
# ⚠️ ADAPT — REQUIRED FIRST STEP:
# Below, the "test" job has THREE alternative language blocks (OPTION 1:
# Java/Maven, OPTION 2: Node.js, OPTION 3: Python), all commented out except
# for their markers.
#   1. Keep the ONE block matching your repo's stack.
#   2. Delete the other two blocks entirely.
#   3. Uncomment the block you kept (remove the leading "# " on each line).
# The "report" job (badge + PR comment) below works automatically afterwards
# — no changes needed there, since every language option writes its result
# the same way (a single `coverage_pct` step output).
# ==============================================================================

name: Quality Gate

on:
  push:
  pull_request:
    branches:
    - main # ⚠️ ADAPT: change if your default branch is not "main"
  workflow_dispatch:


permissions:
  contents: write
  pull-requests: write

jobs:
  test:
    name: Run tests + extract coverage
    runs-on: ubuntu-latest
    outputs:
      coverage_pct: ${{ steps.set_output.outputs.coverage_pct }}

    steps:
    - uses: actions/checkout@v4

    # --------------------------------------------------------------------

    #     retention-days: 14

    # ℹ️ INFO: normalizes the "extract" step output above into the job-level
    # output used by the "report" job below. No changes needed here — this
    # works no matter which OPTION block you kept.
    - name: Set job output
      id: set_output
      if: always()
      run: echo "coverage_pct=${{ steps.extract.outputs.coverage_pct }}" >> "$GITHUB_OUTPUT"

  # ==========================================================================
  # Report job — badge + PR comment. Works out of the box, no edits required
  # (beyond the optional threshold tweaks marked below).
  # ==========================================================================
  report:
    name: Badge + PR comment
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Determine badge color
      id: color
      run: |
        PCT="${{ needs.test.outputs.coverage_pct }}"
        # ⚠️ ADAPT: thresholds below (80% green / 50% yellow) are arbitrary
        # defaults — align with your team's actual coverage target.
        if [ "$PCT" != "N/A" ] && [ "$PCT" -ge 80 ] 2>/dev/null; then
          echo "color=brightgreen" >> "$GITHUB_OUTPUT"
        elif [ "$PCT" != "N/A" ] && [ "$PCT" -ge 50 ] 2>/dev/null; then
          echo "color=yellow" >> "$GITHUB_OUTPUT"
        elif [ "$PCT" = "N/A" ]; then
          echo "color=lightgrey" >> "$GITHUB_OUTPUT"
        else
          echo "color=red" >> "$GITHUB_OUTPUT"
        fi

    # ℹ️ INFO: Each branch gets its own badge subfolder so pushing from
    # different branches never overwrites another branch's badge.
    - name: Generate badge JSON
      run: |
        BRANCH_SLUG=$(echo "${{ github.head_ref || github.ref_name }}" | tr '/' '-')
        mkdir -p "badges-output/${BRANCH_SLUG}"
        cat > "badges-output/${BRANCH_SLUG}/coverage.json" <<EOF
        {"schemaVersion":1,"label":"coverage","message":"${{ needs.test.outputs.coverage_pct }}%","color":"${{ steps.color.outputs.color }}"}
        EOF

    # ⚠️ ADAPT: pushes to a "badges" branch on THIS repo. Make sure you're
    # OK with a "badges" branch being auto-created/pushed to. If you want
    # badges centralized in one shared status-badges repo instead, replace
    # this with `external_repository` + a PAT/deploy key with write access
    # there.
    - name: Deploy badge to badges branch
      if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./badges-output
        publish_branch: badges
        destination_dir: .
        keep_files: true
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'

    - name: Build PR comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      run: |
        PCT="${{ needs.test.outputs.coverage_pct }}"
        if [ "$PCT" != "N/A" ] && [ "$PCT" -ge 80 ] 2>/dev/null; then
          ICON="✅"
        elif [ "$PCT" = "N/A" ]; then
          ICON="⚠️"
        else
          ICON="❌"
        fi

        {
          echo "## 📊 Quality Gate Report — \`${{ github.head_ref }}\`"
          echo ""
          echo "| Metric | Value |"
          echo "|---|---|"
          echo "| Coverage | ${ICON} ${PCT}% |"
          echo ""
          echo "_Generated by the run [#${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) — $(date -u '+%Y-%m-%d %H:%M UTC')_"
        } > pr-comment-body.md

    - name: Post or update PR comment
      if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
      uses: marocchino/sticky-pull-request-comment@v2
      with:
        header: quality-gate-report
        path: pr-comment-body.md
